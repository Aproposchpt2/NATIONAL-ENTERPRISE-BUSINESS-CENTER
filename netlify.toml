[build]
  command = "node scripts/apply-registered-federal-contractors-portal-links.cjs && node scripts/validate-registered-federal-contractors-portal-links.cjs && node scripts/validate-nevada-readiness-wave1.cjs && node scripts/validate-message-horse-current-sites.cjs"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
