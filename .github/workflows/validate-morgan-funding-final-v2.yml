name: Validate Morgan Funding final remediation v2

on:
  pull_request:
    branches:
      - remediation/morgan-funding-behavior-v1-final
    paths:
      - '.validation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run accepted Funding test suite
        run: node --test tests/funding-match.test.js tests/funding-api.test.js tests/funding-integration.test.js
      - name: Verify runtime precision controls
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('netlify/functions/assistant.js','utf8');
          const required = [
            'function fundingPrecisionProfile',
            'function fundingDimensionLines',
            'function applyFundingPrecision',
            'FUNDING READY FOR FURTHER EVALUATION',
            'FUNDING PREPARATION REQUIRED',
            'SPECIALIST REVIEW REQUIRED',
            'The capital purpose is still UNKNOWN',
            'Opportunity-Specific Documentation',
            'Do not search the controlled funding catalog conversationally',
            'Do you have any further questions for me?'
          ];
          const missing = required.filter(x => !s.includes(x));
          if (missing.length) throw new Error('Missing controls: ' + missing.join(' | '));
          console.log('runtime_precision_controls=PASS');
          NODE
