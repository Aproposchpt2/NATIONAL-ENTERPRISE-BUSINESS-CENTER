name: Validate Morgan Funding remediation

on:
  push:
    branches:
      - remediation/morgan-funding-behavior-v1
    paths:
      - 'netlify/functions/assistant.js'
      - '.github/workflows/validate-morgan-funding-remediation.yml'
      - '.validation/**'
  pull_request:
    branches:
      - remediation/morgan-funding-behavior-v1
    paths:
      - '.validation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run accepted Funding test suite
        run: node --test tests/funding-match.test.js tests/funding-api.test.js tests/funding-integration.test.js
      - name: Verify Morgan Funding behavioral controls are present
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('netlify/functions/assistant.js','utf8');
          const required = [
            'FUNDING READY FOR FURTHER EVALUATION',
            'FUNDING PREPARATION REQUIRED',
            'EARLY-STAGE FUNDING DEVELOPMENT',
            'SPECIALIST REVIEW REQUIRED',
            'BUSINESS FOUNDATION',
            'FINANCIAL FOUNDATION',
            'BUSINESS PLANNING',
            'MANAGEMENT CAPACITY',
            'OPPORTUNITY-SPECIFIC DOCUMENTATION',
            'CONTRACT-PERFORMANCE CAPITAL',
            'CONTRACT AWARD ≠ FUNDING APPROVAL',
            'CPA',
            'one controlling immediate priority',
            'cannot determine whether a specific lender or program will approve or qualify you',
            '[[OPEN: funding]]',
            'Do you have any further questions for me?'
          ];
          const missing = required.filter(x => !s.includes(x));
          if (missing.length) throw new Error('Missing behavioral controls: ' + missing.join(' | '));
          console.log('behavioral_controls=PASS');
          NODE
