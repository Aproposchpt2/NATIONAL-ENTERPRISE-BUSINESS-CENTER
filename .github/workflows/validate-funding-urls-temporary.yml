name: Validate funding authoritative URLs

on:
  push:
    branches:
      - agent/funding-authoritative-urls
    paths:
      - '.github/workflows/validate-funding-urls-temporary.yml'
      - 'netlify/functions/_funding-match.js'
      - 'tests/funding-match.test.js'
      - 'tests/funding-api.test.js'
      - 'tests/funding-integration.test.js'

permissions:
  contents: read

jobs:
  validate-funding-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run funding tests
        run: node --test tests/funding-match.test.js tests/funding-api.test.js tests/funding-integration.test.js
      - name: Verify all 549 authoritative source URLs and catalog integrity
        run: |
          node - <<'NODE'
          const m = require('./netlify/functions/_funding-match');
          const e = m.loadEmbeddedEnvelope();
          if (e.records.length !== 549) throw new Error(`record count mismatch: ${e.records.length}`);
          if (e.snapshot_sha256 !== m.CATALOG_PROJECTION_SHA256) throw new Error('catalog projection hash mismatch');
          const missing = e.records.filter(r => !/^https:\/\/www\.sba\.gov\//i.test(r.source_url));
          if (missing.length) throw new Error(`records missing authoritative SBA source: ${missing.length}`);
          const badStatus = e.records.filter(r => r.source_url_status !== 'VERIFIED_AUTHORITATIVE_DIRECTORY');
          if (badStatus.length) throw new Error(`records missing verified status: ${badStatus.length}`);
          const fabricatedProvider = e.records.filter(r => r.provider_url && !/^https:\/\//i.test(r.provider_url));
          if (fabricatedProvider.length) throw new Error(`invalid provider URL values: ${fabricatedProvider.length}`);
          console.log('records=', e.records.length);
          console.log('projection_sha256=', e.snapshot_sha256);
          console.log('microloan_source=', m.AUTHORITATIVE_SOURCE_URLS.microloan);
          console.log('sbic_source=', m.AUTHORITATIVE_SOURCE_URLS.sbic);
          console.log('verified_at=', m.AUTHORITATIVE_SOURCE_VERIFIED_AT);
          NODE
