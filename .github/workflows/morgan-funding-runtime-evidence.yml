name: Morgan Funding Runtime Evidence

on:
  push:
    branches:
      - validation/morgan-funding-runtime-d768039f
    paths:
      - '.github/workflows/morgan-funding-runtime-evidence.yml'
      - 'validation/morgan-funding-runtime-evidence.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MORGAN_PREVIEW_URL: https://deploy-preview-6--nat-enterprise-business-center.netlify.app
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Record validation target
        run: |
          echo 'Implementation branch: agent/nebc-funding-integration'
          echo 'Implementation commit: d768039f08b00b818a74bdb7073e2adde54f83ad'
          echo 'Deploy preview: https://deploy-preview-6--nat-enterprise-business-center.netlify.app'
          echo 'Deploy ID: 6a87829efb4ed1000832a638'
          echo "Harness commit: $GITHUB_SHA"

      - name: Execute 12 deployed Morgan funding scenarios
        run: node validation/morgan-funding-runtime-evidence.js

      - name: Upload runtime evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebc-morgan-funding-runtime-evidence
          path: validation-artifacts/
          if-no-files-found: error
          retention-days: 30
