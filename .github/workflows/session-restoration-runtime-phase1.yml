name: Morgan Session Restoration Runtime Phase 1

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - remediation/morgan-session-restoration-v1
    paths:
      - '.github/workflows/session-restoration-runtime-phase1.yml'
      - 'validation/session-restoration-runtime-phase1.js'

permissions:
  contents: read

jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Execute synthetic runtime setup and first-session persistence
        run: node validation/session-restoration-runtime-phase1.js
      - name: Upload runtime phase 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebc-morgan-session-restoration-phase1
          path: validation-artifacts/session-restoration-phase1.json
          if-no-files-found: error
          retention-days: 30
