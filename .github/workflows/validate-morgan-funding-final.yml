name: Validate Morgan Funding final remediation

on:
  pull_request:
    branches:
      - remediation/morgan-funding-behavior-v1-final
    paths:
      - '.validation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run accepted Funding test suite
        run: node --test tests/funding-match.test.js tests/funding-api.test.js tests/funding-integration.test.js
      - name: Verify final Morgan Funding controls
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('netlify/functions/assistant.js','utf8');
          const required = [
            'EXECUTION ORDER — MANDATORY FOR FUNDING RESPONSES',
            'A dollar amount, urgency, or statement that financing is needed does NOT establish capital purpose by itself',
            'Funding Readiness: <APPROVED CLASSIFICATION>',
            'Business Foundation: ESTABLISHED / GAP / UNKNOWN / NOT APPLICABLE',
            'Financial Foundation: ESTABLISHED / GAP / UNKNOWN / NOT APPLICABLE',
            'Business Planning: ESTABLISHED / GAP / UNKNOWN / NOT APPLICABLE',
            'Management Capacity: ESTABLISHED / GAP / UNKNOWN / NOT APPLICABLE',
            'Opportunity-Specific Documentation: ESTABLISHED / GAP / UNKNOWN / NOT APPLICABLE',
            'FUNDING READY FOR FURTHER EVALUATION',
            'FUNDING PREPARATION REQUIRED',
            'EARLY-STAGE FUNDING DEVELOPMENT',
            'SPECIALIST REVIEW REQUIRED',
            'Funding Readiness: SPECIALIST REVIEW REQUIRED',
            'For an unknown capital purpose, the controlling immediate priority is to define what the capital must accomplish',
            'Do not search the controlled funding catalog conversationally',
            'Do you have any further questions for me?'
          ];
          const missing = required.filter(x => !s.includes(x));
          if (missing.length) throw new Error('Missing final remediation controls: ' + missing.join(' | '));
          console.log('final_behavioral_controls=PASS');
          NODE
