name: Validate NEBC funding center

on:
  push:
    branches:
      - agent/abfop-nebc-funding-center
      - agent/abfop-funding-intelligence
      - agent/nebc-funding-integration
    paths:
      - '.github/workflows/validate-funding-center.yml'
      - 'netlify/functions/_funding-match.js'
      - 'netlify/functions/_funding-catalog-*.js'
      - 'netlify/functions/funding-match.js'
      - 'netlify/functions/_recommend.js'
      - 'netlify/functions/assistant.js'
      - 'netlify/functions/generate-plan.js'
      - 'netlify/functions/member-otp-verify.js'
      - 'tests/funding-match.test.js'
      - 'tests/funding-api.test.js'
      - 'tests/funding-integration.test.js'
      - 'assessment.html'
      - 'business-funding.html'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/validate-funding-center.yml'
      - 'netlify/functions/_funding-match.js'
      - 'netlify/functions/_funding-catalog-*.js'
      - 'netlify/functions/funding-match.js'
      - 'netlify/functions/_recommend.js'
      - 'netlify/functions/assistant.js'
      - 'netlify/functions/generate-plan.js'
      - 'netlify/functions/member-otp-verify.js'
      - 'tests/funding-match.test.js'
      - 'tests/funding-api.test.js'
      - 'tests/funding-integration.test.js'
      - 'assessment.html'
      - 'business-funding.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run funding center tests
        run: node --test tests/funding-match.test.js tests/funding-api.test.js tests/funding-integration.test.js
      - name: Verify function can load embedded catalog
        run: |
          node - <<'NODE'
          const m = require('./netlify/functions/_funding-match');
          const e = m.loadEmbeddedEnvelope();
          if (e.records.length !== 549) throw new Error('record count mismatch');
          console.log('records=', e.records.length);
          console.log('projection_sha256=', e.snapshot_sha256);
          console.log('source_sha256=', m.SOURCE_SNAPSHOT_SHA256);
          NODE
