<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morgan’s Office — NATIONAL ENTERPRISE BUSINESS CENTER™</title><meta name="robots" content="noindex"><link rel="stylesheet" href="/styles.css"><style>.focus-wrap{align-items:flex-start;padding-top:34px;padding-bottom:34px}.assistant.morgan-office{width:min(96vw,1080px)!important;max-width:1080px!important}.assistant.morgan-office .chat{height:62vh;min-height:560px;max-height:760px;scroll-padding-top:18px}.assistant.morgan-office .msg{font-size:1rem;line-height:1.62}.servicebar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid #e3e8e5;background:#fbfcfb}.servicebar a{font-size:.82rem;text-decoration:none}@media(max-width:800px){.assistant.morgan-office .chat{height:64vh;min-height:440px}.focus-wrap{padding-top:20px}}</style></head><body>
<header class="focus-top"><a class="logo" href="/index.html"><span class="mk">N</span>NATIONAL ENTERPRISE BUSINESS CENTER™</a></header>
<main class="focus-wrap"><div class="assistant morgan-office" id="assistant"><div class="hd"><div class="av">M</div><div><h2>Morgan’s Office</h2><div class="status" id="asstStatus">Loading your profile…</div></div></div><nav class="servicebar" aria-label="Member services"><a class="btn btn-ghost" href="/business-funding.html">Funding Center</a><a class="btn btn-ghost" href="/documents.html">Business Documents</a><a class="btn btn-ghost" href="/subscription.html">Membership</a><a class="btn btn-ghost" href="/resume.html">Member Sign-In</a></nav><div class="suggest" id="suggest"><button data-q="What should I focus on first?">What should I focus on first?</button><button data-q="How do I improve my readiness score?">Improve my score</button><button data-q="I need business funding. What should I do next?">Funding readiness</button><button data-q="I'm pursuing State and Federal Contracts">Find contracts</button></div><div class="chat" id="chat"></div><form class="chatform" id="chatForm"><input id="chatInput" placeholder="Ask Morgan your post-assessment question…" autocomplete="off"><button class="btn btn-primary" type="submit">Send</button></form></div></main>
<script src="/app.js"></script><script src="/morgan-session.js"></script><script>
let convo=[],asstContext='',morganStage=2,morganUserEmail='',morganFirstName='',authenticatedMember=null;const chatEl=$('chat');
function getMorganSessionId(){let id='';try{id=sessionStorage.getItem('nebc_morgan_session_id')||'';if(!id){const seed=(crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));id='morgan-'+seed;sessionStorage.setItem('nebc_morgan_session_id',id)}}catch(_){id='morgan-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}return id}let morganSessionId=getMorganSessionId();
function firstNameFrom(o){const n=String((o&&(o.fullName||o.full_name))||'').trim();return n?n.split(/\s+/)[0]:''}function emailFrom(o){return String((o&&(o.email||o.userEmail||o.user_email))||'').trim().toLowerCase()}
function addMsg(role,text){const div=document.createElement('div');div.className='msg '+(role==='user'?'user':'bot');div.innerHTML=role==='user'?escapeHtml(text):mdInline(text);chatEl.appendChild(div);if(role==='user')div.scrollIntoView({behavior:'smooth',block:'start'});else chatEl.scrollTop=chatEl.scrollHeight;return div}
function lockForRestoreFailure(){const input=$('chatInput'),btn=$('chatForm').querySelector('button');input.disabled=true;btn.disabled=true}
function openModule(href){const h=resolveHref(href);if(/^https?:/i.test(h)){window.open(h,'_blank','noopener');return}if(/^mailto:/i.test(h)){location.href=h;return}if(h==='/morgans-office.html'||h==='#'){$('chatInput').focus();return}location.href=h}
function renderActions(actions){if(!Array.isArray(actions)||!actions.length)return;const wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 8px';actions.forEach(a=>{if(!a||!a.href)return;const btn=document.createElement('a');btn.href=resolveHref(a.href);btn.className='btn '+(a.kind==='addon'?'btn-ghost':'btn-primary');btn.style.cssText='font-size:13px;padding:8px 14px';btn.textContent='→ '+a.label;btn.addEventListener('click',e=>{e.preventDefault();openModule(a.href)});wrap.appendChild(btn)});chatEl.appendChild(wrap);chatEl.scrollTop=chatEl.scrollHeight}
async function sendMsg(text){text=(text||'').trim();if(!text)return;addMsg('user',text);convo.push({role:'user',content:text});const typing=addMsg('bot','…');try{const payload={messages:convo,stage:morganStage,sessionId:morganSessionId,userEmail:morganUserEmail,firstName:morganFirstName,context:asstContext};const r=await fetch('/.netlify/functions/assistant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json(),reply=d.reply||'…';typing.innerHTML=mdInline(reply);convo.push({role:'assistant',content:reply});if(authenticatedMember)MorganSession.cache(authenticatedMember,morganSessionId,convo);renderActions(d.actions)}catch(e){typing.textContent='Sorry — try again in a moment.'}}
$('chatForm').addEventListener('submit',e=>{e.preventDefault();const v=$('chatInput').value;$('chatInput').value='';sendMsg(v)});$('suggest').addEventListener('click',e=>{const b=e.target.closest('button');if(b)sendMsg(b.dataset.q)});
(function(){const member=Store.get('abc_member'),profile=Store.get('abc_profile'),funding=Store.get('abfop_funding_profile')||{},ready=Store.get('abfop_readiness')||[];const fundingContext=Object.keys(funding).length?`\nFunding profile: amount ${funding.amount||'unknown'}; use ${funding.use||'unknown'}; timing ${funding.timing||'unknown'}; capital preference ${funding.capital||'unknown'}; purpose ${funding.purpose||'unknown'}.\nFunding readiness items confirmed: ${ready.join(', ')||'none confirmed'}.`:'';
if(member){authenticatedMember=member;morganUserEmail=emailFrom(member);morganFirstName=firstNameFrom(member)||'Founder';asstContext=`Returning member.\nName: ${member.fullName||member.full_name||''}\nBusiness: ${member.businessName||member.business_name||''}\nStage: ${member.businessStage||member.business_stage||''}\nReadiness: ${member.readinessScore||member.readiness_score||''}/100\nServices requested: ${(member.servicesNeeded||member.services_needed||[]).join(', ')}${fundingContext}`;const restoration=MorganSession.read(member);if(restoration.status==='unavailable'){$('asstStatus').textContent='Saved conversation temporarily unavailable';addMsg('bot','Your saved Morgan conversation could not be restored right now. No saved history was changed. Please sign in again later.');lockForRestoreFailure();return}if(restoration.status==='restored'){morganSessionId=restoration.session.sessionId;MorganSession.rememberSessionId(morganSessionId);convo=restoration.session.messages.slice();convo.forEach(m=>addMsg(m.role,m.content));$('asstStatus').textContent='Welcome back — restored your saved Morgan conversation';return}$('asstStatus').textContent='Welcome back — primed with your saved profile';addMsg('bot',`Welcome back, ${morganFirstName}. I have your profile. What would you like to work on today?`)}else if(profile){morganStage=1;morganUserEmail=emailFrom(profile);morganFirstName=firstNameFrom(profile)||'Founder';asstContext=`Business: ${profile.businessName}\nStage: ${profile.businessStage}\nReadiness score: ${profile.readiness?.total||''}/100\nMissing items: ${(profile.missingItems||[]).join(', ')}\nServices requested: ${(profile.servicesNeeded||[]).join(', ')}\nRecommended services: ${(profile.recommendedServices||[]).map(s=>s.label).join(', ')}\nPlan summary: ${String(profile.plan||'').slice(0,1800)}${fundingContext}`;$('asstStatus').textContent='Primed with your assessment for '+profile.businessName;addMsg('bot',`Welcome to Morgan’s Office, ${morganFirstName}. I have your completed assessment and business report. Let’s review your next steps and identify the best service path for your business.`)}else{$('asstStatus').textContent='Start your assessment or sign in to get personalized guidance';addMsg('bot',`Hi — I'm Morgan. To tailor everything to your business, start your free assessment or sign in as a returning member.`);renderActions([{label:'Start Free Business Assessment',href:'/assessment.html',kind:'included'},{label:'Returning Member Sign-In',href:'/resume.html',kind:'included'}])}})();
</script></body></html>
